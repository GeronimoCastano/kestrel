site_name: Kestrel
site_description: A programming language with checked contracts, proofs and a native backend.
site_url: https://geronimocastano.github.io/kestrel/
repo_url: https://github.com/GeronimoCastano/kestrel
repo_name: GeronimoCastano/kestrel
edit_uri: edit/main/docs/
copyright: Kestrel is MIT licensed.

docs_dir: .site-src
site_dir: site

theme:
  name: material
  logo: assets/kestrel.png
  favicon: assets/kestrel.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.select
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/kestrel.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight:
      extend_pygments_lang:
        - name: kestrel
          lang: rust
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Install: install.md
  - Language:
      - Reference manual: manual.md
  - Standard library:
      - Overview: std/index.md
      - std.path: std/path.md
  - Mathematics: math.md
  - Neural networks: kesnet.md
  - Editor: editors/vscode.md
  - Contributing: https://github.com/GeronimoCastano/kestrel/blob/main/CONTRIBUTING.md
  - Changelog: changelog.md
