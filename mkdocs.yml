site_name: Kestrel
site_description: A programming language with checked contracts, proofs and a native backend.
site_url: https://geronimocastano.github.io/kestrel/
repo_url: https://github.com/GeronimoCastano/kestrel
repo_name: GeronimoCastano/kestrel
edit_uri: edit/main/docs/
copyright: Kestrel is MIT licensed.

docs_dir: .site-src
site_dir: site

theme:
  name: material
  logo: assets/kestrel.png
  favicon: assets/kestrel.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.select
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/kestrel.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight:
      extend_pygments_lang:
        - name: kestrel
          lang: rust
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Install: install.md
  - Diagnose: doctor.md
  - Language:
      - Reference manual: manual.md
      - Formatter: formatter.md
  - Packages: packages.md
  - Standard library:
      - Overview: std/index.md
      - Core:
          - std.core: std/core.md
          - std.collections: std/collections.md
          - std.str: std/str.md
          - std.memory: std/memory.md
          - std.func: std/func.md
          - std.algebra: std/algebra.md
          - std.set: std/set.md
          - std.nat: std/nat.md
          - std.real: std/real.md
          - std.test: std/test.md
      - Text and data:
          - std.json: std/json.md
          - std.csv: std/csv.md
          - std.toml: std/toml.md
          - std.regex: std/regex.md
          - std.encoding: std/encoding.md
      - Numbers:
          - std.math: std/math.md
          - std.random: std/random.md
          - std.complex: std/complex.md
          - std.prob: std/prob.md
          - std.linalg: std/linalg.md
          - std.stats: std/stats.md
          - std.statistics: std/statistics.md
      - Data and learning:
          - std.kesdas:
              - Guide: std/kesdas.md
              - Reference: std/kesdas-api.md
          - std.kesnet:
              - Guide: std/kesnet.md
              - Reference: std/kesnet-api.md
          - std.ml:
              - Guide: std/ml.md
              - Reference: std/ml-api.md
          - std.kesplot: std/kesplot.md
      - System:
          - std.path: std/path.md
          - std.fs: std/fs.md
          - std.io: std/io.md
          - std.args: std/args.md
          - std.time: std/time.md
          - std.datetime: std/datetime.md
          - std.process: std/process.md
          - std.term: std/term.md
          - std.python: std/python.md
          - std.c: std/c.md

  - Mathematics: math.md
  - Neural networks: kesnet.md
  - Editor:
      - VS Code: editors/vscode.md
      - Jupyter: editors/jupyter.md
  - Contributing: https://github.com/GeronimoCastano/kestrel/blob/main/CONTRIBUTING.md
  - Changelog: changelog.md
