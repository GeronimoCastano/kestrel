name: Windows probe

# A manual probe for Windows problems the suite cannot explain: build one program with
# debug information and run it under the Windows debugger.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: Debug one program (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Build the compiler
        run: cargo build --release

      - name: Run the program under the debugger
        shell: bash
        run: |
          set -x +e
          folder="$RUNNER_TEMP/probe"
          mkdir -p "$folder"
          cat > "$folder/probe.kes" <<'KES'
          class Point {
          public final label : String
          public var n : Int
          new(label : String) {this.label=label
          this.n=0}
          }
          class Cursor { has Iterator
          public var index : Int
          new() {this.index=0}
          public mut function next() : Option[Point] = if this.index == 3 then None else {
          this.index=this.index+1
          Some(Point("p" + this.index.text())) }
          }
          class Source { has Iterable
          new() {}
          public function items() : Cursor = Cursor()
          }
          function pair(mut values : &dyn Iterable(Item = Point)) : List[String] with Effects { let cursor := values.items()
          let Some(p) := cursor.next() otherwise { return [] }
          let label := p.label
          let Some(q) := cursor.next() otherwise { return [label] }
          [label, q.label] }
          function labels(mut values : &dyn Iterable(Item = Point)) : List[String] with Effects = [p.label for p in values]
          let source : Box[dyn Iterable(Item = Point)] = box(Source())
          print(pair(source))
          print(labels(source))
          let list : Box[dyn Iterable(Item = Point)] = box([Point("a" + "!"), Point("b" + "!")])
          print(pair(list))
          print(labels(list))
          KES
          sed -i 's/^          //' "$folder/probe.kes"
          target/release/kestrel.exe build -o "$folder/probe" --emit-c "$folder/probe.c" "$folder/probe.kes"
          "$folder/probe.exe" || echo "exit $?"
          clang -std=c11 -O0 -g -Wno-unused-function "$folder/probe.c" -o "$folder/debug.exe" || true
          "$folder/debug.exe" || echo "debug build exit $?"
          clang -std=c11 -O1 -g -Wno-unused-function "$folder/probe.c" -o "$folder/o1.exe" || true
          "$folder/o1.exe" || echo "O1 build exit $?"
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          ls "$(dirname "$cdb")" | head -5 || true
          "$cdb" -g -G -lines -y "$folder" -c ".ecxr; kn 30; dv /t; q" "$folder/debug.exe" || true
          "$cdb" -g -G -lines -y "$folder" -c ".ecxr; kn 30; dv /t; q" "$folder/o1.exe" || true
          runtime="$(clang -print-runtime-dir)"; resource="$(clang -print-resource-dir)"
          ls "$runtime" "$resource/lib/windows" 2>/dev/null | grep -i asan | head || true
          clang -std=c11 -O1 -g -fsanitize=address -Wno-unused-function "$folder/probe.c" -o "$folder/asan.exe" || true
          PATH="$runtime:$resource/lib/windows:$PATH" "$folder/asan.exe" || echo "asan exit $?"

      - name: Keep the program and its C
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: ${{ runner.temp }}/probe
