name: Release

# A tag creates a GitHub release with the compiler archives and the VSIX: tarballs
# for macOS and Linux, and a zip for Windows that carries its own C toolchain. The
# release also holds install.ps1 and SHA256SUMS.
# A manual run only builds and keeps the artifacts, for testing the pipeline.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v prefix (for example 0.3.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  compiler:
    name: Compiler (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
          - name: x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported image, so the binary runs on any glibc from 2022 on.
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Asset names carry no version, so releases/latest/download/<asset> always works;
      # the folder inside names the version. The Windows zip is the whole install: Clang,
      # OpenBLAS and Z3 come with it.
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          folder="kestrel-$version-${{ matrix.name }}"
          mkdir -p "dist/$folder"
          cp README.md LICENSE SYNTAX.md "dist/$folder/"
          if [ "$RUNNER_OS" = Windows ]; then
            tools/windows-bundle.sh "target/${{ matrix.target }}/release/kestrel.exe" "dist/$folder"
            (cd dist && 7z a -tzip -mx=9 "../kestrel-${{ matrix.name }}.zip" "$folder" > /dev/null)
            echo "ASSET=kestrel-${{ matrix.name }}.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/kestrel" "dist/$folder/"
            tar -czf "kestrel-${{ matrix.name }}.tar.gz" -C dist "$folder"
            echo "ASSET=kestrel-${{ matrix.name }}.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -l kestrel-${{ matrix.name }}.*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  editor:
    name: Editor extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: editors/vscode-kestrel
        run: npm ci

      - name: Package the extension
        working-directory: editors/vscode-kestrel
        run: npx --yes @vscode/vsce package --out "$RUNNER_TEMP/kestrel.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: editor
          path: ${{ runner.temp }}/kestrel.vsix
          if-no-files-found: error

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [compiler, editor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      # The Windows installer checks its download against SHA256SUMS.
      - name: Collect the files
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          cp install.ps1 release/
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -l release
          cat release/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Kestrel ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release/*
