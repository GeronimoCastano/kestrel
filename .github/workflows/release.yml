name: Release

# A tag creates a GitHub release with the compiler tarballs and the VSIX.
# A manual run only builds and keeps the artifacts, for testing the pipeline.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v prefix (for example 0.1.3)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  compiler:
    name: Compiler (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
          - name: x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          folder="kestrel-$version-${{ matrix.name }}"
          mkdir -p "dist/$folder"
          cp "target/${{ matrix.target }}/release/kestrel" "dist/$folder/"
          cp README.md LICENSE SYNTAX.md "dist/$folder/"
          tar -czf "$folder.tar.gz" -C dist "$folder"
          echo "ASSET=$folder.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  editor:
    name: Editor extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: editors/vscode-kestrel
        run: npm ci

      - name: Package the extension
        working-directory: editors/vscode-kestrel
        run: npx --yes @vscode/vsce package --out "$RUNNER_TEMP/kestrel.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: editor
          path: ${{ runner.temp }}/kestrel.vsix
          if-no-files-found: error

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [compiler, editor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect the files
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -l release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Kestrel ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release/*
