name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The debug checker recurses deeply on the largest KesNet models. The release
  # profile does not need this, and neither does a normal `kestrel run`. The
  # headroom keeps the deepest test from tipping over on the runner.
  RUST_MIN_STACK: "134217728"

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the project documents and tests against. A
      # newer stable can add lints that fire under `-D warnings`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The proof suite exercises the optional `smt` bridge. Without a solver
      # those tests skip, so install it here to keep that path covered.
      - name: Install Z3
        run: brew install z3

      - name: Run the test suite
        run: cargo test

      - name: Check mathlib
        run: ./tools/check_mathlib.sh

  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblapack-dev libblas-dev z3 python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Run the test suite
        run: cargo test --no-fail-fast

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      # The runner image ships LLVM. Clang finds the MSVC linker and the Windows SDK
      # from the Visual Studio installation on the image.
      - name: Show the C toolchain
        run: clang --version

      # The proof suite exercises the optional `smt` bridge, as on macOS and Linux.
      - name: Install Z3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download z3-5.3.3 -R Z3Prover/z3 -p z3-5.3.3-x64-win.zip -D "$RUNNER_TEMP"
          7z x -o"$RUNNER_TEMP" "$RUNNER_TEMP/z3-5.3.3-x64-win.zip" > /dev/null
          echo "$RUNNER_TEMP\\z3-5.3.3-x64-win\\bin" >> "$GITHUB_PATH"

      - name: Run the test suite
        run: cargo test --no-fail-fast

      # The suite drives the library; these steps drive the shipped binary the way a
      # user and the editor extension do.
      - name: Build the compiler
        run: cargo build --release

      - name: Check, run, build, session and serve
        shell: bash
        run: |
          set -euo pipefail
          kestrel=target/release/kestrel.exe
          folder="$RUNNER_TEMP/smoke"
          mkdir -p "$folder"
          printf 'print("Hello, Kestrel!")\n' > "$folder/hello.kes"
          "$kestrel" check "$folder/hello.kes"
          test "$("$kestrel" run "$folder/hello.kes")" = "Hello, Kestrel!"
          "$kestrel" build -o "$folder/hello" "$folder/hello.kes"
          test "$("$folder/hello.exe")" = "Hello, Kestrel!"
          printf 'let n := 40\nprint(n + 2)\n:quit\n' | "$kestrel" session --root "$folder" | tee "$folder/session.txt"
          grep -qx 42 "$folder/session.txt"
          printf '{"id":1,"op":"ping"}\n{"id":2,"op":"shutdown"}\n' | "$kestrel" serve --root "$folder" | tee "$folder/serve.txt"
          grep -q '"id":1' "$folder/serve.txt"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the editor extension tests
        working-directory: editors/vscode-kestrel
        shell: bash
        run: node --test test/*.test.js

  editor:
    name: Editor extension
    runs-on: macos-latest
    defaults:
      run:
        working-directory: editors/vscode-kestrel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      # The suite drives the compiler, so it needs a release binary at the
      # repository root.
      - name: Build the compiler
        run: cargo build --release
        working-directory: .

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Z3
        run: brew install z3

      - name: Run the Node tests
        run: node --test test/*.test.js
