name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The debug checker recurses deeply on the largest KesNet models. The release
  # profile does not need this, and neither does a normal `kestrel run`. The
  # headroom keeps the deepest test from tipping over on the runner.
  RUST_MIN_STACK: "134217728"

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the project documents and tests against. A
      # newer stable can add lints that fire under `-D warnings`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The proof suite exercises the optional `smt` bridge. Without a solver
      # those tests skip, so install it here to keep that path covered.
      - name: Install Z3
        run: brew install z3

      - name: Run the test suite
        run: cargo test

      - name: Check Kestrel formatting
        run: git ls-files -z '*.kes' | xargs -0 ./target/debug/kestrel fmt --check

      - name: Check mathlib
        run: ./tools/check_mathlib.sh

  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblapack-dev libblas-dev z3 python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Run the test suite
        run: cargo test --no-fail-fast

  windows:
    # "bundled" is what the Windows install ships: Clang from llvm-mingw, OpenBLAS and Z3
    # beside kestrel.exe. "MSVC Clang" is the other way to run Kestrel on Windows, with
    # LLVM and Visual Studio installed by hand.
    name: Build and test (Windows${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: bundled
            label: ""
          - toolchain: msvc
            label: ", MSVC Clang"
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      # Windows compiles code behind cfg(windows) that the macOS job never lints.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The suite's own Clang, Z3 and OpenBLAS calls find the bundle through PATH. The
      # MSVC job keeps the runner's LLVM and the Visual Studio linker.
      - name: Assemble the Windows bundle
        shell: bash
        run: |
          tools/windows-bundle.sh - "$RUNNER_TEMP/kestrel"
          echo "$RUNNER_TEMP\\kestrel\\bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP\\kestrel\\z3" >> "$GITHUB_PATH"
          if [ "${{ matrix.toolchain }}" = bundled ]; then
            echo "$RUNNER_TEMP\\kestrel\\toolchain\\bin" >> "$GITHUB_PATH"
          fi

      - name: Show the C toolchain
        run: clang --version

      - name: Run the test suite
        run: cargo test --no-fail-fast

      - name: Build the compiler
        run: cargo build --release

      - name: Check mathlib
        shell: bash
        env:
          KESTREL: target/release/kestrel.exe
        run: ./tools/check_mathlib.sh

      # The installed layout on its own: kestrel.exe finds Clang, Z3 and OpenBLAS beside
      # itself, with no other compiler, solver or LAPACK on PATH.
      - name: Check, run, build, session and serve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.toolchain }}" = bundled ]; then
            cp target/release/kestrel.exe "$RUNNER_TEMP/kestrel/bin/"
            kestrel="$RUNNER_TEMP/kestrel/bin/kestrel.exe"
            PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -vi -e llvm -e '_temp/kestrel' | paste -sd: -)
            for tool in clang z3; do
              if command -v "$tool"; then echo "$tool is still on PATH"; exit 1; fi
            done
          else
            kestrel=target/release/kestrel.exe
          fi
          folder="$RUNNER_TEMP/smoke"
          mkdir -p "$folder"
          printf 'print("Hello, Kestrel!")\n' > "$folder/hello.kes"
          "$kestrel" check "$folder/hello.kes"
          test "$("$kestrel" run "$folder/hello.kes")" = "Hello, Kestrel!"
          "$kestrel" build -o "$folder/hello" "$folder/hello.kes"
          test "$("$folder/hello.exe")" = "Hello, Kestrel!"
          printf 'import std.linalg\nlet A := Tensor([2.0, 1.0, 1.0, 3.0], shape = (2, 2))\nprint((A @ linalg.inverse(A) - Tensor([1.0, 0.0, 0.0, 1.0], shape = (2, 2))).norm() < 1e-12)\ntheorem positive(n : Int) : n > 0 requires h : n >= 1 {smt}\n' > "$folder/batteries.kes"
          test "$("$kestrel" run "$folder/batteries.kes")" = true
          printf 'let n := 40\nprint(n + 2)\n:quit\n' | "$kestrel" session --root "$folder" | tee "$folder/session.txt"
          grep -qx 42 "$folder/session.txt"
          # A project C file loads once per session, so its state carries across entries.
          printf '#include <stdint.h>\nint64_t next(void);\n' > "$folder/counter.h"
          printf '#include "counter.h"\nstatic int64_t count;\nint64_t next(void) { return ++count; }\n' > "$folder/counter.c"
          printf 'import c "counter.h"\nunsafe { next().toInt() }\nunsafe { next().toInt() }\n:quit\n' | "$kestrel" session --root "$folder" | tee "$folder/counter.txt"
          test "$(tr -d '\r' < "$folder/counter.txt")" = "$(printf '1\n2')"
          printf '{"id":1,"op":"ping"}\n{"id":2,"op":"shutdown"}\n' | "$kestrel" serve --root "$folder" | tee "$folder/serve.txt"
          grep -q '"id":1' "$folder/serve.txt"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the editor extension tests
        working-directory: editors/vscode-kestrel
        shell: bash
        run: node --test test/*.test.js

  editor:
    name: Editor extension
    runs-on: macos-latest
    defaults:
      run:
        working-directory: editors/vscode-kestrel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      # The suite drives the compiler, so it needs a release binary at the
      # repository root.
      - name: Build the compiler
        run: cargo build --release
        working-directory: .

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Z3
        run: brew install z3

      - name: Run the Node tests
        run: node --test test/*.test.js

  sanitizers:
    name: Sanitizers (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblapack-dev libblas-dev z3 python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      # Programs built during these tests carry AddressSanitizer and UBSan. The
      # leak detector is off because the runtime pool is intentionally kept.
      - name: Run the tests under the sanitizers
        env:
          KESTREL_SANITIZE: "1"
          ASAN_OPTIONS: "detect_leaks=0"
          LSAN_OPTIONS: "detect_leaks=0"
        run: cargo test --test session --test cli --test contracts

  benchmarks:
    name: Benchmarks
    # Timings differ between machines and are noisy, so the gate runs on main
    # and by hand, not on every pull request.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Compare with the recorded results
        run: python3 tools/check_benchmarks.py --runs 3 --current benchmarks/current.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: benchmarks/current.json
          if-no-files-found: ignore
